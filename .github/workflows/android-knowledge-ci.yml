name: Android knowledge integration checks

on:
  push:
    branches:
      - 'feature/knowledge-android*'
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and unsigned debug build
        working-directory: third_party/markor
        run: |
          chmod +x gradlew
          ./gradlew :app:testFlavorDefaultDebugUnitTest :app:assembleFlavorDefaultDebug --no-daemon --stacktrace

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -t .
