name: Android knowledge integration checks

on:
  push:
    branches:
      - 'feature/knowledge-android*'
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests (APK disabled for Stage 21 draft)
        working-directory: third_party/markor
        env:
          # gradlew defaults to a 64 MiB launcher heap; the Gradle protocol
          # response for this multi-flavor build can exhaust that heap.
          GRADLE_OPTS: -Xms128m -Xmx768m
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Keep job logs compact enough for offline/mobile troubleshooting.
          # Preserve the full Gradle log only on the ephemeral CI runner.
          log="$RUNNER_TEMP/dpks-gradle-ci.log"
          tasks=(:app:testFlavorDefaultDebugUnitTest :app:testFlavorAtestDebugUnitTest)
          if [ "${GITHUB_HEAD_REF:-}" != 'feature/stage21-safe-backup-workspace' ]; then
            tasks+=(:app:assembleFlavorDefaultDebug :app:assembleFlavorAtestDebug)
          else
            echo 'Stage 21 draft: no APK assemble tasks are authorized.'
          fi
          if ! ./gradlew "${tasks[@]}" \
            --no-daemon --no-parallel --max-workers=2 --stacktrace > "$log" 2>&1; then
            echo '::group::Compiler errors and failing Gradle tasks'
            grep -nE 'error:|Compilation failed|FAILURE:|What went wrong|Execution failed|^> Task .*FAILED' \
              "$log" | tail -n 90 || true
            echo '::endgroup::'
            echo '::group::Final Gradle lines'
            tail -n 40 "$log"
            echo '::endgroup::'
            exit 1
          fi
          tail -n 24 "$log"
      - name: Confirm standalone DP Knowledge package ID
        if: github.head_ref != 'feature/stage21-safe-backup-workspace'
        run: |
          set -euo pipefail
          apk=$(find third_party/markor/app/build/outputs/apk/flavorAtest/debug -name '*.apk' -print -quit)
          test -n "$apk"
          package_name="$("${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/35.0.0/aapt" \
            dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$package_name" = 'com.dpsmpx.dpks'
      - name: Verify embedded Python runtime payload
        if: github.head_ref != 'feature/stage21-safe-backup-workspace'
        run: |
          apk=$(find third_party/markor/app/build/outputs/apk/flavorDefault/debug -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -Z1 "$apk" | grep -q '^assets/chaquopy/'

  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -t .
