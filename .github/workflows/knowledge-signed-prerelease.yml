name: Signed DP Knowledge Stage 21 QA release

on:
  # Explicit workflow edits on the approved Stage 21 branch publish one
  # signed, installable QA prerelease. Normal source pushes do not publish.
  push:
    branches:
      - feature/stage21-safe-backup-workspace
    paths:
      - .github/workflows/knowledge-signed-prerelease.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-knowledge-stage21-qa
  cancel-in-progress: false

jobs:
  sign-and-publish:
    if: github.ref == 'refs/heads/feature/stage21-safe-backup-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact Stage 21 source commit
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and signing tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Confirm signing secrets before building
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret not configured: $name"
              exit 1
            fi
          done

      - name: Confirm the existing in-app Stage 21 self-test is present
        shell: bash
        run: |
          set -euo pipefail
          qa=third_party/markor/app/src/main/java/net/gsantner/markor/knowledge/KnowledgeDeviceQaRunner.java
          bridge=third_party/markor/app/src/main/python/ksys_android_bridge.py
          strings=third_party/markor/app/src/main/res/values-ru/knowledge_strings.xml
          grep -Fq 'step("PORTABLE-21", this::checkSyntheticStage21Portable)' "$qa"
          grep -Fq 'step("SYNC-21-SUITE", this::checkSyntheticStage21Sync)' "$qa"
          grep -Fq 'def stage21_sync_selftest(' "$bridge"
          grep -Fq 'SYNC21-BATCH-ATOMIC' "$bridge"
          grep -Fq 'Проверить Stage 21' "$strings"

      - name: Run all Python core and Android bridge tests
        run: python -m unittest discover -s tests -t .

      - name: Test both Android flavors and build only the standalone DPKS release APK
        working-directory: third_party/markor
        env:
          GRADLE_OPTS: -Xms128m -Xmx768m
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testFlavorDefaultDebugUnitTest :app:testFlavorAtestDebugUnitTest \
            :app:assembleFlavorAtestRelease \
            --no-daemon --no-parallel --max-workers=2 --stacktrace

      - name: Align, sign, verify and hash the exact DPKS APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tools_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools/35.0.0"
          test -x "$tools_dir/zipalign"
          test -x "$tools_dir/apksigner"
          test -x "$tools_dir/aapt"

          mapfile -d '' -t apks < <(find third_party/markor/app/build/outputs/apk/flavorAtest/release \
            -maxdepth 1 -type f -name '*-unsigned.apk' -print0)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected one unsigned standalone DPKS APK, got ${#apks[@]}"
            exit 1
          fi
          package_name="$("$tools_dir/aapt" dump badging "${apks[0]}" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [[ "$package_name" != 'com.dpsmpx.dpks' ]]; then
            echo "::error::Unexpected package ID: $package_name"
            exit 1
          fi
          # Release must contain the Python bridge for all Stage 21 checks.
          unzip -Z1 "${apks[0]}" | grep '^assets/chaquopy/' > /dev/null

          keystore="$RUNNER_TEMP/knowledge-stage21-signing-key"
          aligned="$RUNNER_TEMP/knowledge-stage21-aligned.apk"
          short_sha="${GITHUB_SHA:0:10}"
          apk="$GITHUB_WORKSPACE/dpks-stage21-qa-${GITHUB_RUN_NUMBER}-${short_sha}-signed.apk"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          "$tools_dir/zipalign" -f 4 "${apks[0]}" "$aligned"
          "$tools_dir/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$apk" "$aligned"
          "$tools_dir/apksigner" verify --min-sdk-version 24 "$apk" > /dev/null
          signed_package="$("$tools_dir/aapt" dump badging "$apk" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$signed_package" = 'com.dpsmpx.dpks'
          (cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$apk")") > "$apk.sha256"
          (cd "$GITHUB_WORKSPACE" && sha256sum -c "$(basename "$apk").sha256")
          printf 'APK_PATH=%s\n' "$apk" >> "$GITHUB_ENV"
          echo 'Signed DP Knowledge System QA APK and SHA-256 verified.'

      - name: Publish signed Stage 21 QA APK and checksum to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:10}"
          tag="knowledge-stage21-qa-${GITHUB_RUN_NUMBER}-${short_sha}"
          notes="$(printf '%s\n' \
            'DP Knowledge System — подписанная ПРЕДВАРИТЕЛЬНАЯ сборка Stage 21 для ручной аппаратной приёмки.' \
            '' \
            '- Android package: com.dpsmpx.dpks (не заменяет обычный Markor).' \
            '- Кнопка: Процессы → Проверки → «Проверить Stage 21 и устройство».' \
            '- PORTABLE-21: зашифрованный синтетический архив, manifest, high-water, отсутствие секретов и отказ при подмене.' \
            '- SYNC21-*: 7 синтетических проверок причинности, ручного согласования, устаревшего состояния, источника, структурных операций, отказа и атомарного batch_accept.' \
            '- SQLite на Android 15 / SQLite 3.44: global read-only quick_check с FTS может дать ложный WARN (известный дефект движка, исправлен upstream в 3.45.1); это не доказательство целостности реальной базы.' \
            '- При SQLITE-RO-CHECK или INDEX-INTEGRITY WARN сохраните обезличенные baseTablesQuickCheck и ftsStorageQuickCheck из INDEX-01 и SANDBOX-01; они проверяют только B-tree, не подменяют полную FTS-проверку.' \
            '- Не пересоздавайте реальный индекс только ради устранения WARN; приложение ничего не восстанавливает автоматически.' \
            '- Отчёт обезличенный; тесты используют приватный временный кэш и не пишут в библиотеку заметок.' \
            '- Реальные Android SAF, Keystore, сопряжение двух устройств, WorkManager и 20 000 файлов необходимо отдельно проверить владельцу.' \
            '- Порядок проверки: docs/STAGE21_DEVICE_ACCEPTANCE.md и корневой TODO.md.' \
            '- Автоматической отправки заметок, автоматической загрузки моделей и переноса чужих решений без согласия нет.' \
            '- APK подписан существующим release key из GitHub Secrets; SHA-256 приложен отдельным файлом.' \
            '- Оригинальный редактор: Markor, Gregor Santner и участники; код Apache-2.0, переводы и примеры CC0-1.0.' \
            '- Stage 21 остаётся NOT PASS до реальных испытаний. Это не production/stable релиз.' \
            '' \
            "Исходный коммит: ${GITHUB_SHA}." \
          )"
          gh release create "$tag" "$APK_PATH" "$APK_PATH.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DPKS Stage 21 — signed device QA #${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --prerelease
